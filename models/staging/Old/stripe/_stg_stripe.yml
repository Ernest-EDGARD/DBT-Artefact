version: 2

models:
  - name: stg_stripe__payments
    description: Staged payment data from Stripe.
    columns:
      - name: payment_id
        description: Primary key for payments.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to stg_jaffle_shop__orders.order_id.
      - name: payment_method
        description: "{{ doc('payment_method') }}"
      - name: amount
        description: Total amount of the transaction in USD.